# Local stack: Airflow (web UI + scheduler) and two Postgres databases.
#   airflow-db : Airflow's own metadata
#   warehouse  : our job-posting data (raw snapshots, cleaned tables, metrics)
# Start with:  docker compose up -d     UI: http://localhost:8080
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Singapore
  AIRFLOW_CONN_WAREHOUSE: postgresql://${WAREHOUSE_USER}:${WAREHOUSE_PASSWORD}@warehouse:5432/${WAREHOUSE_DB}
  MCF_MAX_PAGES: ${MCF_MAX_PAGES:-0}
  MCF_LIVE_PAGES: ${MCF_LIVE_PAGES:-3}   # near-real-time feed: pages of 100 newest postings per 30-min poll
  # Optional Telegram alerts (dags/common/alerts.py). Empty = only the ops.alert_log table. Set them in .env, never in git.
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  PYTHONPATH: /opt/airflow
  # No _PIP_ADDITIONAL_REQUIREMENTS any more: openpyxl and rapidfuzz are baked into our own image at build
  # time, pinned (docker/airflow/Dockerfile, docs/docker-images.md), instead of pip-installed at every start.

# Our Airflow image. Bump the -rN tag whenever docker/airflow/ changes: compose then sees a missing image and
# builds it on the next `docker compose up -d`, so no laptop keeps running a stale one.
x-airflow-image: &airflow-image
  image: is3107-airflow:2.10.5-r1
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile

x-airflow-volumes: &airflow-volumes
  - ./dags:/opt/airflow/dags
  - ./ingestion:/opt/airflow/ingestion
  - ./transform:/opt/airflow/transform
  - ./quality:/opt/airflow/quality
  - ./metrics:/opt/airflow/metrics
  - ./sql:/opt/airflow/sql
  - ./data:/opt/airflow/data
  - ./logs:/opt/airflow/logs

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_DB}
    ports:
      - "5433:5432"   # connect from your laptop on port 5433
    volumes:
      - warehouse:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d   # runs once, on first start
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${WAREHOUSE_USER}"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-image
    user: "${AIRFLOW_UID:-50000}:0"
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      airflow-db:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --role Admin --username "${AIRFLOW_ADMIN_USER}" --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-image
    user: "${AIRFLOW_UID:-50000}:0"
    environment: *airflow-env
    volumes: *airflow-volumes
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-image
    user: "${AIRFLOW_UID:-50000}:0"
    environment: *airflow-env
    volumes: *airflow-volumes
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      warehouse:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    image: is3107-dashboard:r1      # bump when dashboard/Dockerfile or its requirements change
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_USER: ${WAREHOUSE_USER}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
      WAREHOUSE_DB: ${WAREHOUSE_DB}
    volumes:
      - ./dashboard:/app/dashboard
      - ./transform:/app/transform
    ports:
      - "8501:8501"   # http://localhost:8501
    depends_on:
      warehouse:
        condition: service_healthy
    restart: unless-stopped

  # One-off PySpark job on the Parquet lake (spark/skill_demand.py, docs/lake-and-spark.md). Under a profile, so
  # `docker compose up -d` never starts it. Run it with:  docker compose --profile spark run --rm spark
  # Local mode, 2 cores, 1 GB driver: about 1.5 GB in all while it runs, then the container is removed.
  spark:
    image: apache/spark:3.5.7-python3      # pinned; about 540 MB to pull once
    profiles: ["spark"]
    volumes:
      - ./spark:/opt/spark-jobs:ro
      - ./data/lake:/opt/lake
    mem_limit: 2g
    command: ["/opt/spark/bin/spark-submit", "--master", "local[2]", "--driver-memory", "1g",
              "/opt/spark-jobs/skill_demand.py", "--lake", "/opt/lake"]

volumes:
  airflow-db:
  warehouse:
