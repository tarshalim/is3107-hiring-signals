# Local stack: Airflow (web UI + scheduler) and two Postgres databases.
#   airflow-db : Airflow's own metadata
#   warehouse  : our job-posting data (raw snapshots, cleaned tables, metrics)
# Start with:  docker compose up -d     UI: http://localhost:8080
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Singapore
  AIRFLOW_CONN_WAREHOUSE: postgresql://${WAREHOUSE_USER}:${WAREHOUSE_PASSWORD}@warehouse:5432/${WAREHOUSE_DB}
  MCF_MAX_PAGES: ${MCF_MAX_PAGES:-0}
  PYTHONPATH: /opt/airflow
  # The official image has no openpyxl (reference xlsx files) or rapidfuzz (skill matching). The image's
  # entrypoint pip-installs this list at container start. Without it the transform DAG's load_reference
  # task cannot read data/reference/*.xlsx and fuzzy matching falls back to difflib (different results).
  _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-openpyxl>=3.1 rapidfuzz>=3.0}

x-airflow-volumes: &airflow-volumes
  - ./dags:/opt/airflow/dags
  - ./ingestion:/opt/airflow/ingestion
  - ./transform:/opt/airflow/transform
  - ./quality:/opt/airflow/quality
  - ./sql:/opt/airflow/sql
  - ./data:/opt/airflow/data
  - ./logs:/opt/airflow/logs

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_DB}
    ports:
      - "5433:5432"   # connect from your laptop on port 5433
    volumes:
      - warehouse:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d   # runs once, on first start
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${WAREHOUSE_USER}"]
      interval: 5s
      retries: 10

  airflow-init:
    image: apache/airflow:2.10.5
    user: "${AIRFLOW_UID:-50000}:0"
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      airflow-db:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --role Admin --username "${AIRFLOW_ADMIN_USER}" --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User --email admin@example.com || true

  airflow-webserver:
    image: apache/airflow:2.10.5
    user: "${AIRFLOW_UID:-50000}:0"
    environment: *airflow-env
    volumes: *airflow-volumes
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.10.5
    user: "${AIRFLOW_UID:-50000}:0"
    environment: *airflow-env
    volumes: *airflow-volumes
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      warehouse:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_USER: ${WAREHOUSE_USER}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
      WAREHOUSE_DB: ${WAREHOUSE_DB}
    volumes:
      - ./dashboard:/app/dashboard
      - ./transform:/app/transform
    ports:
      - "8501:8501"   # http://localhost:8501
    depends_on:
      warehouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  airflow-db:
  warehouse:
